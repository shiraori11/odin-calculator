<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
  <script src="./script.js" defer></script>
  <link href="./style.css" rel="stylesheet">
</head>
<body>

  <div class="calculator-container">
    
    <p class="display">Calculator</p>
    
    <div class="input-container">
      
      <div class="num-container">
        <div class="row-one">
          <button>1</button>
          <button>2</button>
          <button>3</button>
        </div>
        <div class="row-two">
          <button>4</button>
          <button>5</button>
          <button>6</button>
        </div>
        <div class="row-three">
          <button>7</button>
          <button>8</button>
          <button>9</button>
        </div>
        <div class="row-four">
          <button>C</button>
          <button>0</button>
          <button>.</button>
        </div>
      </div>
      
      <div class="operator-container">
        <button>+</button>
        <button>-</button>
        <button>*</button>
        <button>/</button>
        <button>=</button>
      </div>
      
    </div>
  </div>
</body>
</html>
